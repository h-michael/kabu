[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
ignore = [
    # unsafe-libyaml is unmaintained (archived upstream) and has no safe
    # upgrade. It comes in only through serde_yaml, which is itself
    # deprecated. Remove this entry once serde_yaml is replaced with a
    # maintained YAML crate.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no safe upgrade; pulled in by serde_yaml" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
