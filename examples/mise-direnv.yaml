# yaml-language-server: $schema=https://raw.githubusercontent.com/h-michael/kabu/main/schema/kabu.schema.json

# When to use: Projects using mise + direnv for tool and env setup.
# Run: kabu trust && kabu add ../wt-mise -b wt-mise
# Expected effect: Links env files, copies template, installs tools.
# Pitfall: `direnv allow` trusts the target directory's `.envrc`.

on_conflict: skip

link:
  - source: .envrc
    description: direnv config

  - source: .env.local
    description: Local env values

copy:
  - source: .env.example
    target: .env
    description: Environment template

hooks:
  post_add:
    - command: mise install
      description: Install tools via mise

    - command: direnv allow
      description: Trust direnv config
