# yaml-language-server: $schema=https://raw.githubusercontent.com/h-michael/kabu/main/schema/kabu.schema.json

# When to use: Suggest branch names in interactive add mode.
# Run: kabu add -i
# Expected effect: New-branch input is pre-filled from `branch_template`.
# Pitfall: `branch_template` supports {{commitish}}, {{repository}}, {{strftime(...)}}.

worktree:
  path_template: ../worktrees/{{branch}}
  branch_template: review/{{strftime(%Y-%m-%d)}}/{{commitish}}

# More examples:
# branch_template: review/{{commitish}}
# branch_template: {{repository}}/review/{{commitish}}
# branch_template: hotfix/{{strftime(%m%d)}}-{{commitish}}
